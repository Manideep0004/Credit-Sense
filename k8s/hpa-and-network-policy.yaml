apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creditsense-api-hpa
  namespace: creditsense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: creditsense-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: creditsense-network-policy
  namespace: creditsense
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic within the creditsense namespace
    - from:
        - podSelector: {}
    # Allow ingress from ingress controllers or prometheus
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow intra-namespace communication (Postgres, Redis, Jaeger)
    - to:
        - podSelector: {}
    # Allow external HTTPS calls (e.g. LLM API providers)
    - ports:
        - protocol: TCP
          port: 443
