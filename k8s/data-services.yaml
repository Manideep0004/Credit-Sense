apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: creditsense-postgres
  namespace: creditsense
spec:
  serviceName: creditsense-postgres
  replicas: 1
  selector:
    matchLabels:
      app: creditsense-postgres
  template:
    metadata:
      labels:
        app: creditsense-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "creditsense_db"
            - name: POSTGRES_USER
              value: "creditsense"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: creditsense-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: creditsense-postgres
  namespace: creditsense
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: creditsense-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditsense-redis
  namespace: creditsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: creditsense-redis
  template:
    metadata:
      labels:
        app: creditsense-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: creditsense-redis
  namespace: creditsense
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: creditsense-redis
